<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIG BOOKTHER – Prototipo no funcional</title>
<style>
:root{--blue:#1f4fa0;--dark:#153a78;--paper:#f3f6fb;--ln:#d5dcea;--ink:#1b2433;--mut:#5b6679}
*{box-sizing:border-box;font-family:system-ui,"Segoe UI",Arial,sans-serif}
body{margin:0;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0}
:focus-visible{outline:3px solid var(--dark);outline-offset:2px}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:#fff;color:#000;padding:48px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero h1{font-size:48px;line-height:1.05;margin-bottom:12px}
.hero p{margin:0 auto 8px;max-width:36ch;color:#000}
.hero .logo{width:min(100%,460px);height:auto;margin:0 auto 32px}
.box{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--blue);color:#fff}
.box label{color:#fff}
.box .btn{background:#fff;color:var(--blue)}
.box .btn:hover{background:var(--paper)}
.box form{width:100%;max-width:340px}
.box h2{font-size:24px;margin-bottom:16px}
@media(max-width:760px){#login{grid-template-columns:1fr}.hero{padding:28px}.hero h1{font-size:36px}}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--blue);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
aside .brand{color:#fff;font-weight:700;font-size:18px;padding:0 10px 14px}
aside button{background:none;border:0;color:#fff;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer;width:100%}
aside button:hover,aside button.on{background:var(--dark)}
aside button.on{font-weight:700}
aside .sp{flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.corner{position:fixed;right:24px;bottom:20px;width:120px;height:auto;opacity:.4;z-index:5;cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--ln);padding:12px 24px;display:flex;justify-content:space-between;color:var(--mut)}
header b{color:var(--ink)}
.view{padding:24px;max-width:1040px;width:100%;flex:1}
.view>h2{font-size:24px}
.sub{color:var(--mut);margin:2px 0 4px}
.db{font-size:12px;color:var(--mut);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:16px;overflow-x:auto}
.card h3{font-size:17px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.f{display:flex;flex-direction:column;gap:3px;flex:1;min-width:150px}
label{font-size:13px;color:var(--mut)}
input,select,textarea{border:1px solid #b5bfd3;border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);font-size:15px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{background:var(--dark)}
.btn.alt{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.alt:hover{background:var(--paper)}
.btn.sm{padding:4px 10px;font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#e4ebf7;color:var(--dark)}
.tag.on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mod{text-align:left;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:16px;cursor:pointer}
.mod:hover{background:var(--dark)}
.mod b{display:block;font-size:17px;color:#fff}.mod span{font-size:13px;color:#fff}
.pc{border:2px solid var(--ln);border-radius:8px;padding:12px;text-align:center;background:#fff}
.pc.l{background:var(--blue);border-color:var(--blue);color:#fff}
.pc b{display:block}
.ticket{background:#fff;border:1px dashed #8a96ad;padding:14px;max-width:380px;white-space:pre-wrap;font-size:13px;font-family:"Courier New",monospace}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{background:#fff;color:var(--blue);border:1px solid var(--blue);border-radius:6px;padding:7px 14px;cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff}
.tot{margin-left:auto;width:260px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{border-top:2px solid var(--ink);font-weight:700;font-size:18px}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap}aside .brand,aside .sp{display:none}aside button{width:auto}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const MOD=[
['P02','Menú principal','Accesos de tu rol',['Estudiante','Bibliotecario','Cajero','Administrador']],
['P03','Catálogo','Buscar libros y ver disponibilidad',['Estudiante','Bibliotecario']],
['P04','Inventario','Libros y ejemplares',['Bibliotecario']],
['P05','Registrar préstamo','Folio de préstamo',['Bibliotecario']],
['P06','Devoluciones y sanciones','Cerrar préstamos y mora',['Bibliotecario']],
['P07','Equipos de cómputo','Estatus y uso de equipos',['Bibliotecario','Administrador']],
['P08','Punto de venta','Ventas con ticket e IVA',['Cajero']],
['P09','Sincronizar padrón','Lista de alumnos de la Escuela',['Administrador']],
['P10','Administración','Usuarios, secciones, respaldos y reportes',['Administrador']]];
let role='',tab='Usuarios';
const h=(t,s,db)=>`<h2>${t}</h2><p class="sub">${s}</p><p class="db">Tablas: ${db}</p>`;
const fld=(l,id,v='',t='text')=>`<div class="f"><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${v}"></div>`;
const sel=(l,id,o)=>`<div class="f"><label for="${id}">${l}</label><select id="${id}">${o.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
const tag=(t,on)=>`<span class="tag ${on?'on':''}">${t}</span>`;
const tbl=(c,r)=>`<table><thead><tr>${c.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const SEC=['Novela','Computación','Matemáticas','Ciencias'];

function go(id){
 $('#wt').textContent=id;
 $('#nav').innerHTML=MOD.filter(m=>m[3].includes(role)).map(m=>`<button class="${m[0]==id?'on':''}" data-id="${m[0]}">${m[1]}</button>`).join('');
 $('#view').innerHTML=V[id]();scrollTo(0,0)}

const V={
P02:()=>h('Menú principal','Módulos disponibles para el rol '+role+'.','Usuario, Estudiante')+`<div class="grid">${MOD.filter(m=>m[0]!='P02'&&m[3].includes(role)).map(m=>`<button class="mod" data-id="${m[0]}"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')}</div>`,

P03:()=>h('Catálogo','Busca por título, autor o sección.','Libro, Seccion, Ejemplar')+`
<div class="card"><div class="row">${fld('Buscar','q')}${sel('Sección','fs',['Todas',...SEC])}<button class="btn">Buscar</button><button class="btn alt">Limpiar filtros</button></div></div>
<div class="card">${tbl(['Título','Autor','Sección','Precio','Ejemplares disponibles',''],[
['Mil novecientos ochenta y cuatro','George Orwell','Novela','$250.00',tag('1',1),role=='Bibliotecario'?'<button class="btn alt sm" data-id="P05">Solicitar préstamo</button>':''],
['Cien años de soledad','Gabriel García Márquez','Novela','$320.00',tag('2',1),''],
['Estructuras de datos en Java','Weiss','Computación','$610.00',tag('0'),''],
['Cálculo de una variable','Stewart','Matemáticas','$480.00',tag('3',1),''],
['Física universitaria','Sears','Ciencias','$480.00',tag('1',1),''] ])}</div>`,

P04:()=>h('Inventario','Alta de libros y ejemplares, y su clasificación.','Libro, Seccion, Ejemplar')+`
<div class="card"><h3>Alta de libro</h3><div class="row">${fld('Título','a1')}${fld('Autor','a2')}${sel('Sección','a3',SEC)}${fld('Precio','a4','','number')}<button class="btn">Guardar libro</button></div></div>
<div class="card"><h3>Alta de ejemplar</h3><div class="row">${fld('Código del ejemplar','b1','EJ-0001')}${sel('Libro','b2',['Mil novecientos ochenta y cuatro','Cien años de soledad','Cálculo de una variable'])}${sel('Tipo de stock','b3',['Consulta','Venta'])}${sel('Estatus','b4',['Disponible','Prestado','Vendido','En revisión','Baja'])}<button class="btn">Guardar ejemplar</button></div></div>
<div class="card"><h3>Ejemplares</h3>${tbl(['Código','Libro','Tipo de stock','Estatus','Acciones'],[
['EJ-0001','Mil novecientos ochenta y cuatro','Consulta',tag('Disponible',1),'<button class="btn alt sm">Reclasificar</button> <button class="btn alt sm">Dar de baja</button>'],
['EJ-0007','Estructuras de datos en Java','Consulta',tag('Prestado'),'<button class="btn alt sm">Reclasificar</button> <button class="btn alt sm">Dar de baja</button>'],
['EJ-0031','Cálculo de una variable','Venta',tag('Disponible',1),'<button class="btn alt sm">Reclasificar</button> <button class="btn alt sm">Dar de baja</button>'],
['EJ-0044','Física universitaria','Venta',tag('Vendido'),'<button class="btn alt sm">Reclasificar</button> <button class="btn alt sm">Dar de baja</button>'] ])}</div>`,

P05:()=>h('Registrar préstamo','Máximo 2 libros por estudiante, 3 días de préstamo.','Prestamo, Estudiante, Ejemplar, Usuario, Sancion')+`
<div class="card"><div class="row">${fld('Matrícula','m','20230145')}${fld('Código del ejemplar','c','EJ-0001')}<button class="btn">Verificar</button></div></div>
<div class="card"><h3>Validación</h3>${tbl(['Dato','Valor'],[
['Estudiante','Ana López Ruiz · ana.lopez@itsx.edu.mx '+tag('Activo',1)],
['Sanciones pendientes','Ninguna'],['Préstamos activos','1 de 2'],
['Ejemplar','EJ-0001 · Mil novecientos ochenta y cuatro '+tag('Disponible',1)],
['Fecha de préstamo','23/10/2026 12:30'],['Fecha límite','26/10/2026 12:30'],['Atiende','Juan Luis (Usuario)'] ])}
<p><button class="btn">Confirmar préstamo</button></p></div>
<div class="card"><h3>Folio de préstamo</h3><div class="ticket">BIG BOOKTHER
FOLIO: 124
Matrícula: 20230145
Ejemplar: EJ-0001
Prestado: 23/10/2026 12:30
Devolver antes de: 26/10/2026 12:30</div>
<p><button class="btn alt">Imprimir folio</button> <button class="btn alt">Enviar por correo</button></p></div>`,

P06:()=>h('Devoluciones y sanciones','Registra la entrega y consulta la mora.','Prestamo, Ejemplar, Sancion, Estudiante')+`
<div class="card"><div class="row">${fld('Folio del préstamo','fo','118')}<button class="btn">Buscar</button></div></div>
<div class="card"><h3>Préstamo</h3>${tbl(['Dato','Valor'],[
['Folio','118'],['Estudiante','20230145 · Ana López Ruiz'],['Ejemplar','EJ-0007 · Estructuras de datos en Java'],
['Fecha de préstamo','16/10/2026 09:00'],['Fecha límite','19/10/2026 09:00'],['Fecha de devolución','23/10/2026 12:45'],
['Estatus',tag('Vencido')],['Días de retraso','4'] ])}
<div class="row" style="margin-top:12px">${sel('Estado del ejemplar','eb',['Disponible','En revisión','Baja'])}<button class="btn">Registrar devolución</button></div></div>
<div class="card"><h3>Sanción</h3><div class="row">${fld('Monto','sm','40.00','number')}<div class="f" style="flex:2"><label for="mo">Motivo</label><textarea id="mo" rows="2">Retraso de 4 días en la devolución del préstamo 118.</textarea></div>${sel('Estatus','se',['Pendiente','Pagada','Condonada'])}</div>
<p><button class="btn">Guardar sanción</button> <button class="btn alt">Condonar / ajustar</button></p></div>`,

P07:()=>h('Equipos de cómputo','Estatus de las computadoras de la sala.','Equipo, UsoEquipo, Estudiante')+`
<p>${tag('Libre',1)} ${tag('En uso')} ${tag('Sin servicio')}</p>
<div class="grid">${[['PC-01','l','Libre'],['PC-02','','En uso'],['PC-03','l','Libre'],['PC-04','','Sin servicio'],['PC-05','l','Libre'],['PC-06','l','Libre'],['PC-07','','En uso'],['PC-08','l','Libre']].map(p=>`<div class="pc ${p[1]}"><b>${p[0]}</b>${p[2]}</div>`).join('')}</div>
<div class="card" style="margin-top:16px"><h3>Asignar equipo</h3><div class="row">${fld('Matrícula','pm','20230145')}${sel('Equipo','pe',['PC-01','PC-03','PC-05','PC-06','PC-08'])}<button class="btn">Asignar</button><button class="btn alt">Finalizar uso</button></div></div>
